<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Candlestick-style minimalist logo for Listing Tracker -->
  <title>Listing Tracker Logo</title>
  <!-- Left candle (primary) -->
  <line x1="24" y1="20" x2="24" y2="76" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <rect x="18" y="36" width="12" height="24" rx="2" fill="#2563EB"/>
  <!-- Middle candle (accent) -->
  <line x1="48" y1="16" x2="48" y2="80" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <rect x="42" y="28" width="12" height="28" rx="2" fill="#F59E0B"/>
  <!-- Right candle (secondary) -->
  <line x1="72" y1="26" x2="72" y2="70" stroke="#1E40AF" stroke-width="4" stroke-linecap="round"/>
  <rect x="66" y="44" width="12" height="14" rx="2" fill="#1E40AF"/>
  <!-- Uptrend curve (success) -->
  <path d="M16 76 C36 62, 60 86, 80 68" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>

